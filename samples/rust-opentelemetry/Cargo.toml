[package]
name = "log-site-hash-rust-otel-sample"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
log = "0.4"
murmur3 = "0.5"
uuid = "1"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["logs"] }
opentelemetry-appender-log = { version = "0.31", features = ["experimental_metadata_attributes"] }
opentelemetry-stdout = { version = "0.31", features = ["logs"] }
